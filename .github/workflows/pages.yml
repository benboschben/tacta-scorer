# Tests the scorer, then publishes web/ to GitHub Pages.
# One-time setup: repo Settings > Pages > Source: "GitHub Actions".
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # -L copies the files web/ symlinks to (the scorer and a sample photo).
      - run: mkdir _site && cp -RL web/. _site/
      # Serve Pyodide and OpenCV from the site itself. The 340 MB release is
      # cached between runs; the script copies about 27 MB of it.
      - uses: actions/cache@v4
        with:
          path: .cache/pyodide
          key: pyodide-${{ hashFiles('scripts/vendor_pyodide.py') }}
      - run: python3 scripts/vendor_pyodide.py --out _site/pyodide
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
